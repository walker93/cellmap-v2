<!DOCTYPE html>
<html lang="en">

<head>
    <title>Cell Map Designer</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.10.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.10.0/mapbox-gl.css' rel='stylesheet' />
    <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.3.0/mapbox-gl-draw.js"></script>
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.3.0/mapbox-gl-draw.css"
        type="text/css">
    <script
        src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script>
    <link rel="stylesheet"
        href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.css"
        type="text/css">
    <link href='https://watergis.github.io/mapbox-gl-export/mapbox-gl-export.css' rel='stylesheet' />
    <script src="https://watergis.github.io/mapbox-gl-export/mapbox-gl-export.js"></script>
    <script src="https://kit.fontawesome.com/1f687205b2.js" crossorigin="anonymous"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/numeral.js/2.0.6/numeral.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.js"></script>
    <script src="lib/tokml.js"></script>
    <script src="lib/papaparse.min.js"></script>
    <script src="config.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.6.0/jszip.min.js"></script>
    <link rel="stylesheet" href="lib/tom-select.default.min.css">
    <script src="lib/tom-select.complete.min.js"></script>



    <link rel="stylesheet" href="style.css" type="text/css">

    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
</head>

<body>
    <header class="line">
        <img id="logo" src="images/Logo.png" alt="Cell Map Designer logo">
        <h1>Cell Map Designer</h1>
    </header>
    <main>
        <div id="map-container">
            <div id="map" role="region" aria-label="Interactive map"></div>
        </div>
        <div class="resizer" id="dragMe" aria-hidden="true"></div>
        <div id="controls">
            <div id="inputs" role="dialog" aria-modal="true" aria-label="Add or edit feature">
                <div id="cell-form">

                    <div class="line">
                        <label for="inp_name">Name:</label>
                        <input type="text" id="inp_name" placeholder="Enter cell name">
                    </div>
                    <div class="line">
                        <label for="inp_desc">Description:</label>
                        <input type="text" id="inp_desc" placeholder="Description">
                    </div>
                    <div class="line">
                        <label for="inp_lat">Lat:</label>
                        <input type="text" id="inp_lat" placeholder="Latitude">
                    </div>
                    <div class="line">
                        <label for="inp_lon">Long:</label>
                        <input type="text" id="inp_lon" placeholder="Longitude">
                    </div>
                    <div class="line">
                        <label for="inp_radius">Radius:</label>
                        <input type="number" id="inp_radius" placeholder="Radius in km" min="0" max="10" step="0.25"
                            value="3">
                    </div>
                    <div class="line">
                        <label for="angle1">Start angle:</label>
                        <input type="number" id="angle1" placeholder="Angle min" min="-360" max="360" value="0">
                    </div>
                    <div class="line">
                        <label for="angle2">End angle:</label>
                        <input type="number" id="angle2" placeholder="Angle max" min="-360" max="360" value="360">
                    </div>
                    <div class="line">
                        <label for="inp_alpha">Trasparency:</label>
                        <input type="number" id="inp_alpha" placeholder="Trasparency" min="0.1" max="1" step="0.01"
                            value="0.2">
                    </div>
                    <div class="line">
                        <label for="inp_fill">Color:</label>
                        <input type="color" id="inp_fill" placeholder="Colore" value="#FF0000">
                    </div>
                    <div class="line">
                        <label for="inp_icon">Icon:</label>
                        <select id="inp_icon" placeholder="Select icon" value="" disabled>
                            <option value="" selected>Choose an icon</option>
                        </select>
                    </div>
                    <input type="hidden" id="feature-id" value="">
                    <button id="cancelbtn" class="form-btn">Annulla</button>
                    <button id="addbtn" class="form-btn" style="display: inline-block;">Aggiungi</button>
                    <button id="savebtn" class="form-btn" style="display: none;">Salva</button>
                </div>
            </div>
            <div id="buttons" role="toolbar" aria-label="Map tools">
                <button id="add"><i aria-hidden="true" class="fa-sharp fa-solid fa-plus"></i> Add Cell</button>
                <button id="import"><i aria-hidden="true" class="fa-sharp fa-solid fa-file-csv"></i> Add from
                    CSV</button>
                <button id="savejson"><i aria-hidden="true" class="fa-sharp fa-solid fa-file-export"></i> Export
                    GeoJson</button>
                <button id="importjson"><i aria-hidden="true" class="fa-sharp fa-solid fa-file-import"></i> Import
                    GeoJson</button>
                <button id="savekml"><i aria-hidden="true" class="fa-sharp fa-solid fa-file-arrow-down"></i>
                    Generate KML</button>
                <button id="addoverlay"><i aria-hidden="true" class="fa-sharp fa-solid fa-file-arrow-up"></i>
                    Add Overlay</button>
                <button id="deleteall"><i aria-hidden="true" class="fa-sharp fa-solid fa-trash-can"></i> Delete
                    All</button>
            </div>
            <div id="elements">
                <div id="table" class="tab">
                    <input type="checkbox" name="accordion-1" id="cb1" aria-controls="tab1-content" checked>
                    <label for="cb1" id="tab1-label" class="tab__label">Cell Towers</label>
                    <div class="tab__content" id="tab1-content" role="region" aria-labelledby="tab1-label">
                        <div id="features">

                        </div>
                    </div>
                </div>
                <div id="poi-table" class="tab">
                    <input type="checkbox" name="accordion-2" id="cb2" aria-controls="tab2-content">
                    <label for="cb2" id="tab2-label" class="tab__label">Points of interest:</label>
                    <div class="tab__content" id="tab2-content" role="region" aria-labelledby="tab2-label">
                        <div id="poi">
                        </div>
                    </div>
                </div>
                <div id="over-table" class="tab">
                    <input type="checkbox" name="accordion-3" id="cb3" aria-controls="tab3-content">
                    <label for="cb3" id="tab3-label" class="tab__label">Overlays</label>
                    <div class="tab__content" id="tab3-content" role="region" aria-labelledby="tab3-label">
                        <div id="overlays">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <p>© 2024 Cell Map Designer by <a class="link" href="https://alexcortinovis.tech" target="_blank">Alex
                Cortinovis</a></p>
                <p>Icons by Maps Icons Collection <a class="link" href="https://mapicons.mapsmarker.com" target="_blank">https://mapicons.mapsmarker.com</a></p>
        <script type="module" src="new_script.js"></script>
        <script type="module" src="resizer.js"></script>
    </footer>
</body>

</html>
